name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  export-apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot and export templates
        run: |
          set -e
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q $BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Android SDK
        run: |
          SDK=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $SDK/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Debug keystore and Godot editor settings
        run: |
          SDK=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore $GITHUB_WORKSPACE/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.3.tres; do
          cat > ~/.config/godot/$f <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done

      - name: Import project
        run: |
          godot --headless --import || true
          godot --headless --import || true

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/ZombieSurvivor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ZombieSurvivor-apk
          path: build/*.apk
